; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
upload_speed = 921600
monitor_speed = 115200 ; must remain at 115200 for improv
; Following embedded files required if we build our own ESPIDF (see framework below)
;board_build.embed_txtfiles =
;    managed_components/espressif__esp_insights/server_certs/https_server.crt
;    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
;    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
;    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

[env:ratgdo_esp32dev]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
board_build.partitions = partitions.csv
; If we build our own ESPIDF then change framework line to include espidf
;framework = arduino, espidf
framework = arduino
build_flags =
    ${env.build_flags}
    -Wall
    -Wno-format
    -Wl,--wrap=esp_panic_handler
    ;-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
    -D USE_ESP_IDF_LOG
    -D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
    -D SOC_WIFI_SUPPORTED=1
    -D CONFIG_ETH_ENABLED=1
    ;-D USE_GDOLIB
    ;-D USE_NTP_TIMESTAMP
    ;-D CRASH_DEBUG
    -D RATGDO32_DISCO
    -D RATGDO_ENCODER
;monitor_filters = esp32_exception_decoder
lib_deps =
   https://github.com/dkerr64/espsoftwareserial.git
   https://github.com/HomeSpan/HomeSpan.git#2.1.8
   ;https://github.com/HomeSpan/HomeSpan.git#dev
   ;https://github.com/dkerr64/HomeSpan.git
   https://github.com/stm32duino/VL53L4CX#1.1.0
   https://github.com/improv-wifi/sdk-cpp.git#v1.2.5
   https://github.com/mathertel/OneButton#2.6.1
   ;https://github.com/davidshimjs/qrcodejs.git#04f46c6a0708418cb7b96fc563eacae0fbf77674
   ;https://github.com/dkerr64/gdolib.git#sw-serial
   https://github.com/shah253kt/magic_enum
lib_ldf_mode = deep+
lib_compat_mode = off
extra_scripts =
   build_flags.py
   pre:build_web_content.py
   pre:auto_firmware_version.py
   pre:patch_files.py
   post:upload_fw.py


;-------------------------------------------------------------------------
; Adafruit QT Py boards. The ESP32-S2 and ESP32-S3 versions share a pinout.
; See README.md "Adafruit QT Py ESP32-S3 / ESP32-S2" for wiring and setup.
;-------------------------------------------------------------------------
[qtpy]
build_flags =
    ; Comments give the pin label printed on the QT Py
    -D UART_TX_GPIO=GPIO_NUM_5              ; TX
    -D UART_RX_GPIO=GPIO_NUM_16             ; RX
    -D INPUT_OBST_GPIO=GPIO_NUM_18          ; A0
    -D DRY_CONTACT_OPEN_GPIO=GPIO_NUM_17    ; A1
    -D DRY_CONTACT_CLOSE_GPIO=GPIO_NUM_9    ; A2
    -D DRY_CONTACT_LIGHT_GPIO=GPIO_NUM_8    ; A3
    -D STATUS_DOOR_GPIO=GPIO_NUM_7          ; SDA
    -D STATUS_OBST_GPIO=GPIO_NUM_6          ; SCL
    -D BEEPER_GPIO=GPIO_NUM_35              ; MO
    -D LASER_GPIO=GPIO_NUM_37               ; MI
    -D SENSOR_SHUTDOWN_GPIO=GPIO_NUM_36     ; SCK
    -D SENSOR_SDA_GPIO=GPIO_NUM_41          ; STEMMA QT connector
    -D SENSOR_SCL_GPIO=GPIO_NUM_40          ; STEMMA QT connector
    ; Status LED is the onboard NeoPixel (LED_BUILTIN from the board variant)

;-------------------------------------------------------------------------
; Adafruit QT Py ESP32-S3, 4MB flash / 2MB PSRAM (https://www.adafruit.com/product/5700)
;-------------------------------------------------------------------------
[env:qtpy_esp32s3]
extends = env:ratgdo_esp32dev
board = adafruit_qtpy_esp32s3_n4r2
; Don't flash Adafruit's UF2 bootloader image, it would land inside our app1 partition
board_upload.arduino.flash_extra_images =
build_flags =
    ${env:ratgdo_esp32dev.build_flags}
    ${qtpy.build_flags}

;-------------------------------------------------------------------------
; Adafruit QT Py ESP32-S2 (https://www.adafruit.com/product/5325)
;
; USB CDC serial is disabled: the precompiled TinyUSB stack needs ~30KB of
; static RAM and the firmware does not fit on the ESP32-S2 with it. To upload
; over USB, hold BOOT while pressing RESET to enter the ROM bootloader. After
; the first flash, use OTA from the web page. WiFi setup is by soft AP.
;-------------------------------------------------------------------------
[env:qtpy_esp32s2]
extends = env:ratgdo_esp32dev
board = adafruit_qtpy_esp32s2
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${env:ratgdo_esp32dev.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    ${qtpy.build_flags}


;-------------------------------------------------------------------------
; MJS DEV ESP32 Board
;-------------------------------------------------------------------------
[env:MJS_dev32]
extends = env:ratgdo_esp32dev
build_unflags =
    -D RATGDO32_DISCO
build_flags = 
    ${env:ratgdo_esp32dev.build_flags}
    -D WALLPANEL_DISCONNECT_ON_TX
    -D LED_BUILTIN_GPIO=GPIO_NUM_19
    -D LED_BUILTIN_ON_STATE=LOW


;-------------------------------------------------------------------------
; MJS DEV ESP32 Board - http upload
;-------------------------------------------------------------------------
[env:MJS_dev32_http]
extends = env:ratgdo_esp32dev
build_unflags =
    -D RATGDO32_DISCO
build_flags = 
    ${env:ratgdo_esp32dev.build_flags}
    -D WALLPANEL_DISCONNECT_ON_TX
    -D LED_BUILTIN_GPIO=GPIO_NUM_19
    -D LED_BUILTIN_ON_STATE=LOW
upload_port = garage-door-4ea12c.local
upload_protocol = custom
